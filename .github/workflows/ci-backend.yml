name: GitHub Actions Demo - Continuous Integration
on: [pull_request]
jobs:
  build:    
    runs-on: ubuntu-latest
    steps:
      - name: Cache Dependencies
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Checkout repository code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
        
      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Build backend
        run: cd backend && npm run build

      - name: Generate Artifact
        run: cd backend/build && zip -r artifact.zip ./ -x '*.git*'

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-artifact
          path: backend/build/artifact.zip

  lint:
    needs: [build]
    name: Ensure Code Style (Lint)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7
      
      - name: Cache Dependencies
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies        
        run: cd backend && npm ci

      - name: Lint code
        run: cd backend && npm run lint

  audit:
    name: 🛡️ Audit Backend Packages
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      - name: Check for vulnerabilities
        run: cd backend && npm audit --production --audit-level=moderate
                                                # use "high" for Prod                                                

  test:
    needs: [lint]
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7
      
      - name: Cache Dependencies
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: cd backend && npm i

      - name: Run Unit Tests
        run: cd backend && npm t

  static-analysis:
    name: 🔬 Run Static Code Analysis
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          config-file: ./.github/codeql/codeql.config.yml

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache Node Modules
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: cd backend && npm ci

      - name: Build
        run: cd backend && npm run build

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v4